# AideRun - Antigravity IDE 便携版一体化启动器、环境自部署与升级管理工程清单
[package]
name = "aide-run"
version = "1.3.0"
edition = "2021"
description = "Antigravity IDE 便携版启动器：玻璃拟态面板、托盘多开、一键部署、智能清理与 Win 版检测升级"

[[bin]]
name = "AideRun"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
dunce = "1.0"
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tao = "0.37"
toml = "0.9"
tray-icon = "0.25"
walkdir = "2.5"
winreg = "0.56"
wry = "0.57"

[build-dependencies]
embed-resource = "3.0"

[dependencies.windows-sys]
version = "0.61"
features = [
    "Win32_Foundation",
    "Win32_Security_Credentials",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "unwind"
strip = true

